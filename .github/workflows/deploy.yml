name: Deploy to cPanel

on:
  push:
    branches: [Dev]
    paths-ignore:
      - 'studio/**'
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an FTP transfer midway through a release.
concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    name: Build, deploy, and verify production
    steps:
      - uses: actions/checkout@v4

      - name: Require an explicit FTP destination
        env:
          FTP_DIR: ${{ vars.CPANEL_FTP_SERVER_DIR }}
        run: |
          if [[ -z "$FTP_DIR" || "$FTP_DIR" != */ ]]; then
            echo 'Set CPANEL_FTP_SERVER_DIR to the verified FTP-relative document root, ending in /.'
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
        run: pnpm build

      # public/.htaccess is copied by Vite; do not overwrite it here.
      - name: Stamp the built release
        run: node scripts/stamp-release.mjs

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ vars.CPANEL_FTP_SERVER_DIR }}
          local-dir: dist/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-root-state.json
          exclude: |
            **/.git*
            **/*.md
            **/*.sh

      - name: Verify the release at the public domain
        env:
          SITE_URL: https://cpr-rwanda.rw
        run: node scripts/verify-deployment.mjs
